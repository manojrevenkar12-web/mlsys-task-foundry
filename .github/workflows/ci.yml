name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: pytest -q -m "not slow"

  forge:
    # every task's grader, proven again: the reference passes twice, every mutant is rejected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - run: pytest -q -m slow -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlsys-task-foundry .
      - name: the image serves the console and the API
        run: |
          if ! out=$(docker run -d --name foundry -p 18765:8000 mlsys-task-foundry 2>&1); then
            echo "::error::docker run failed: $out"; exit 1
          fi
          for i in $(seq 40); do curl -fs localhost:18765/healthz && break; sleep 1; done
          if ! curl -fs localhost:18765/api/summary | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['forge']['tasks'] >= 20, d"; then
            echo "::error::summary check failed: $(docker logs foundry 2>&1 | tail -5 | tr '\n' ' ')"; exit 1
          fi
          curl -fs localhost:18765/ | grep -q 'id="root"' || { echo "::error::console not served"; exit 1; }

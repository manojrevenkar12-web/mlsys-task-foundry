criteria:
  - id: host-bound-with-numbers
    weight: 30
    text: Says the device is idle most of each step and backs it with the measured busy share and load time
    pass: '"the device is busy about 5% of the step; load_batch takes ~15 ms of a ~17 ms step"'
    fail: '"the model is slow" or a claim with no numbers from the trace'
  - id: names-decode
    weight: 20
    text: Names decode_images as the largest host cost and augment as minor
    pass: '"decode_images is ~90% of load_batch; augment ~10%"'
    fail: treats load_batch as one opaque block
  - id: overlap-first
    weight: 25
    text: Proposes overlapping input with compute (prefetching the next batch on a background thread or with an input library) and states its limit
    pass: '"prefetch with a background thread or grain; step time drops to max(load, update), so still host-bound"'
    fail: proposes only a faster device or a bigger model
  - id: make-host-work-cheaper
    weight: 25
    text: Proposes making the host work itself cheaper or parallel (vectorised decode, worker processes, moving augmentation onto the device)
    pass: '"decode in parallel worker processes and do flips and shifts on device with jax.random"'
    fail: no change to the host work itself

wrong: "The integer products are accumulated across K blocks in a float32 scratch (dot with preferred_element_type=float32) instead of an int32 accumulator; float32 has a 24-bit mantissa, so once a partial sum passes 2^24 (easily reached for K=8192 with large-magnitude int8 values) the sum is no longer exact, violating the exact-integer-accumulation requirement (random inputs still match bit-for-bit)."

  decode_gemm_8x4096x4096: {bound: memory, roof_fraction: 0.86}
  decode_attention_b32_ctx2048: {bound: memory, roof_fraction: 0.80}
  rmsnorm_8192x4096: {bound: memory, roof_fraction: 0.67}
  rope_8192x4096: {bound: memory, roof_fraction: 0.55}

explanation: >-
  Ridge = 989.4e12 / 3.35e12 = 295 FLOP/byte. The prefill GEMMs are compute-bound; decode GEMM,
  attention, rmsnorm, rope and the LM head are memory-bound. The surprise is the LM head: with
  only 64 rows its 128,256 x 4,096 weight read dominates and it sits at 63 FLOP/byte, far left of
  the ridge, yet it reaches 81% of its bandwidth roof. The two furthest below their roofs are
  rope (55%) and the 256-token prefill GEMM (58% of peak): for rope I would fuse it into the QKV
  projection epilogue to avoid a separate HBM pass; for the small GEMM I would check tile sizes
  and wave quantisation, since 256 rows give too few output tiles to fill the SMs.

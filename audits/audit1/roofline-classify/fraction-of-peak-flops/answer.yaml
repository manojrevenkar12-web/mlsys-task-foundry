explanation: >-
  Ridge = 989.4e12 / 3.35e12 = 295 FLOP/byte. Only the 4096- and 512-token prefill GEMMs are
  above it; the 256-token GEMM (228 FLOP/byte) and the 64-row LM head (63 FLOP/byte) are
  memory-bound, which is the surprise: a GEMM is not automatically compute-bound when one
  dimension is small. Measured against the chip's 989 TFLOP/s, the memory-bound ops reach only a
  small fraction of peak; the furthest below are rmsnorm (0.2%) and decode attention / rope
  (0.3%). For those I would look first at fusing them into neighbouring kernels to avoid the HBM
  round trip and at whether the KV-cache reads in attention are coalesced and use the full
  bandwidth.

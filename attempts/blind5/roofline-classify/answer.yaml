ridge_flop_per_byte: 295.3
ops:
  prefill_gemm_4096x4096x4096: {bound: compute, roof_fraction: 0.84}
  prefill_gemm_512x4096x4096: {bound: compute, roof_fraction: 0.70}
  prefill_gemm_256x4096x4096: {bound: memory, roof_fraction: 0.75}
  decode_gemm_8x4096x4096: {bound: memory, roof_fraction: 0.86}
  decode_attention_b32_ctx2048: {bound: memory, roof_fraction: 0.80}
  rmsnorm_8192x4096: {bound: memory, roof_fraction: 0.67}
  rope_8192x4096: {bound: memory, roof_fraction: 0.55}
  lm_head_64x128256x4096: {bound: memory, roof_fraction: 0.81}
explanation: |
  Ridge point: 989.4 TFLOP/s divided by 3.35 TB/s gives 295.3 FLOP/byte. Each op's arithmetic intensity is
  its FLOPs divided by its bytes; its roof is min(989.4 TFLOP/s, intensity times 3.35 TB/s); roof_fraction
  is achieved FLOP/s (FLOPs divided by measured time) over that roof.

  Surprises: (1) prefill_gemm_256x4096x4096 is a GEMM but is memory-bound: its intensity is 228 FLOP/byte,
  below the ridge, because 256 rows of weights only give it 228 FLOPs per byte moved. The 512-row GEMM (410)
  is compute-bound. (2) The lm_head at 64 rows is memory-bound (intensity 63): it streams the 1.05 GB
  weight matrix once for 64 tokens, so its time is set by the weight read (318.7 us of traffic at full
  bandwidth against 393 us measured). (3) The decode GEMM with 8 rows is memory-bound, as expected, at
  86% of its bandwidth roof.

  The two furthest below the roof are rope (55%: 138 MB moved in 75 us, 1.84 TB/s effective against 3.35 TB/s)
  and rmsnorm (67%: 134 MB in 60 us, 2.24 TB/s). Both are elementwise or row-reduction ops with no reuse,
  so the roof is bandwidth. For these I would look first at (a) whether they run as separate kernels that
  each read and write the activation through HBM (fuse rope into the QKV projection epilogue, and fuse
  rmsnorm with the residual add or with the following GEMM's prologue), since an extra pass would
  double the traffic; and (b) the access pattern and launch shape (vectorized 16-byte loads, enough rows per
  block to saturate bandwidth, and whether the 8192 rows give enough parallelism). The bytes are fixed by
  the table, so the gain comes from speed, not less traffic: at 80% to 90% of the 3.35 TB/s roof, rope's 138 MB
  would take 46 to 52 us (saving 23 to 29 us from 75 us) and rmsnorm's 134 MB 48 to 53 us (saving 7 to 12 us).

bottleneck: straggler
straggler_host: 2
stall_event: read_shard_from_storage
stalled_steps: 6
mean_step_ms: 16.473
step_ms_without_stall: 13.669
explanation: >-
  Lining the four hosts up per step (by step_num) shows every step has the same shape: next_batch
  (about 1.2-2.1 ms), fusion.forward_backward (about 8.8-9.6 ms), the gradient all-reduce, then a
  600 us fusion.optimizer. The all-reduce ends at the same instant on all four hosts, and it ends a
  nearly constant ~1.9-2.1 ms after the LAST host joins it; the measured all-reduce duration on a
  host is therefore mostly time spent waiting for the others. In 14 steps the hosts arrive within
  about 1 ms of each other and each step is ~13.2-14.2 ms. In 6 steps (3, 6, 8, 9, 10, 11) host 2
  (pid 3, /host:2) runs a read_shard_from_storage event of 6.8-11.8 ms in its Host input lane before
  next_batch, reaches the all-reduce 5.5-11.7 ms after every other host, and hosts 0, 1 and 3 sit in
  all-reduce events of 7.4-13.9 ms while host 2's own all-reduce is the normal ~2 ms. That is why the
  team sees "most hosts spend a large share of the step in all-reduce": the three healthy hosts
  record the wait as collective time, and the one host that is actually late looks like the only
  one with a fast all-reduce. The real cost of the collective is the ~2 ms after the last arrival;
  the network is fine and compute is balanced. Mean train_step is 16.47 ms; if host 2's
  read_shard_from_storage took no time (host 2 arriving that much earlier, the all-reduce still
  ending ~2 ms after the last arrival) the mean would be 13.67 ms, about 17% faster (1.21x
  throughput); the stalled steps go from 19.6-25.1 ms back to ~13.5-14 ms. Fix host 2's input path
  rather than the network: prefetch/overlap input (e.g. tf.data/grain prefetch or a background
  reader so the next shard is read while the current step computes), cache or pre-stage shards on
  local disk, check that host's storage mount / throughput (it is the only host that reads shards
  synchronously at a step boundary), or rebalance shard assignment. Tuning or compressing the
  all-reduce would gain at most a fraction of the ~2 ms real collective time and would not remove
  the 5-12 ms waits.

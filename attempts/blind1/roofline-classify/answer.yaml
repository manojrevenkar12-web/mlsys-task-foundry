ridge_flop_per_byte: 295.34
ops:
  prefill_gemm_4096x4096x4096: {bound: compute, roof_fraction: 0.84}
  prefill_gemm_512x4096x4096: {bound: compute, roof_fraction: 0.70}
  prefill_gemm_256x4096x4096: {bound: memory, roof_fraction: 0.75}
  decode_gemm_8x4096x4096: {bound: memory, roof_fraction: 0.86}
  decode_attention_b32_ctx2048: {bound: memory, roof_fraction: 0.80}
  rmsnorm_8192x4096: {bound: memory, roof_fraction: 0.67}
  rope_8192x4096: {bound: memory, roof_fraction: 0.55}
  lm_head_64x128256x4096: {bound: memory, roof_fraction: 0.81}
explanation: >-
  Ridge = 989.4e12 / 3.35e12 = 295.3 FLOP/byte. Arithmetic intensities: 4096^3 GEMM 1365
  (compute, 831 TFLOP/s = 0.84 of peak); 512x4096x4096 409.6 (compute, 693 TFLOP/s = 0.70);
  256x4096x4096 227.6 (memory: roof 762 TFLOP/s, achieved 572 = 0.75); decode GEMM M=8 8.0
  (memory, 2.88 TB/s = 0.86); decode attention 1.0 (memory, 2.68 TB/s = 0.80); RMSNorm 1.0
  (memory, 2.25 TB/s = 0.67); RoPE 1.45 (memory, 1.84 TB/s = 0.55); LM head 64x128256x4096 63.0
  (memory, 2.71 TB/s = 0.81). Surprises: (1) the 256-token prefill GEMM is still memory-bound
  (227 < 295) - a GEMM with M=256 against a 4096x4096 bf16 weight does not reach the ridge;
  M of roughly 330+ is needed. (2) The LM head does 67 GFLOPs, the most of any op but the big
  GEMM, yet with only 64 rows it is memory-bound at AI 63: it is dominated by reading the 1.05 GB
  vocab matrix, so it costs ~393 us, more than the 4096^3 GEMM. (3) Decode attention has AI
  exactly 1 FLOP/byte (each KV byte is used once per query with no reuse across the batch), so
  no amount of tensor-core tuning helps; only less KV traffic (GQA grouping, FP8 KV) does.
  The two furthest below their roof are RoPE (0.55, 75 us vs 41 us minimum) and RMSNorm (0.67,
  60 us vs 40 us). For RoPE I would look first at the memory access pattern: the rotate-half /
  interleaved-pair access and the cos/sin table gather often break coalesced, vectorised
  (128-bit) loads, and an unfused RoPE re-reads Q/K that the QKV GEMM just wrote, so fusing it
  into the QKV GEMM epilogue or the attention kernel removes the whole 138 MB round trip. For
  RMSNorm I would check whether the kernel makes two passes over each 4096-wide row (one for the
  sum of squares, one to normalise) without keeping the row in registers/shared memory, the
  fp32 upcast and vector width, and occupancy/grid size (one row per block, 8192 blocks); then
  fuse it with the residual add and the next GEMM's prologue. Both are pure bandwidth ops, so
  the ceiling is ~3.35 TB/s and fusion beats tuning.

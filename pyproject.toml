[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsys-task-foundry"
version = "0.1.0"
description = "Verified ML-systems tasks (Pallas kernels, profiler traces, distributed debugging, LLM serving) with graders proven against plausible wrong answers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "jax[cpu]==0.12.0.1",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
foundry = "foundry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: validates every task end to end (runs every reference and mutant)"]
timeout = 900

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["tasks", "attempts", "audits"]  # task code is graded content, written as a solver would write it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
  "S101",  # assert is how graders and tests state checks
  "S603",  # the runner starts subprocesses on purpose (sandboxed grading)
  "RUF001", "RUF002", "RUF003",  # typographic characters in prose
  "E501",  # ruff format wraps code; long strings and messages stay readable on one line
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"]  # seeded generators for synthetic traces, not cryptography
"tests/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/foundry"]
